    <!-- Structured Data (Schema.org WebApplication + PotentialAction) -->
    <script id="nullbox-jsonld" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://team-09.fasthacks.cloud/#website",
            "name": "Nullbox",
            "alternateName": "ヌルボックス",
            "url": "https://team-09.fasthacks.cloud/",
            "inLanguage": ["en", "ja"],
            "description": "Privacy-first customer support and issue tracking portal."
          },
          {
            "@type": "WebApplication",
            "@id": "https://team-09.fasthacks.cloud/#app",
            "name": "Nullbox",
            "url": "https://team-09.fasthacks.cloud/",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "All",
            "browserRequirements": "Requires JavaScript for interactive SPA features; REST API available at /api/tickets.",
            "description": "Nullbox is a privacy-first customer support and issue tracking portal. Customers submit tickets with or without an account and track responses via a secret capability link.",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "potentialAction": [
              {
                "@type": "CreateAction",
                "name": "Submit a Support Ticket",
                "description": "Report a problem to Nullbox support via the web form at / or POST /api/tickets.",
                "target": {
                  "@type": "EntryPoint",
                  "urlTemplate": "https://team-09.fasthacks.cloud/api/tickets",
                  "httpMethod": "POST",
                  "encodingType": "application/json",
                  "contentType": "application/json",
                  "actionApplication": {
                    "@id": "https://team-09.fasthacks.cloud/#app"
                  }
                },
                "result": {
                  "@type": "Thing",
                  "name": "Support Ticket Capability Link"
                },
                "object": {
                  "@type": "DigitalDocument",
                  "name": "CreateTicketRequest"
                },
                "query-input": [
                  {
                    "@type": "PropertyValueSpecification",
                    "valueName": "subject",
                    "description": "Short summary of the problem (1-200 characters)",
                    "valueRequired": true,
                    "valueMaxLength": 200
                  },
                  {
                    "@type": "PropertyValueSpecification",
                    "valueName": "body",
                    "description": "Detailed description, steps to reproduce, and error messages (1-10000 characters)",
                    "valueRequired": true,
                    "valueMaxLength": 10000
                  },
                  {
                    "@type": "PropertyValueSpecification",
                    "valueName": "severity",
                    "description": "Ticket severity level: p1 (critical), p2 (high), p3 (medium, default), or p4 (low)",
                    "valueRequired": true,
                    "defaultValue": "p3"
                  },
                  {
                    "@type": "PropertyValueSpecification",
                    "valueName": "customer_name",
                    "description": "Optional customer display name (omit to receive an anonymous animal alias)",
                    "valueRequired": false,
                    "valueMaxLength": 100
                  },
                  {
                    "@type": "PropertyValueSpecification",
                    "valueName": "customer_email",
                    "description": "Optional customer email address",
                    "valueRequired": false,
                    "valueMaxLength": 254
                  }
                ]
              }
            ]
          }
        ]
      }
    </script>

        <h1>Nullbox — Customer Support &amp; Issue Tracking Portal</h1>
        <p>
          Tell us everything. Submit a support ticket with or without an account and track updates
          using your one-time secret capability link.
        </p>
        <p>
          Automated agents and non-JavaScript clients can interact directly with the REST API at
          <code>POST /api/tickets</code> as documented in <a href="/llms.txt">/llms.txt</a> and
          <a href="/openapi.json">/openapi.json</a>.
        </p>
      </main>
      <footer>No tickets were harmed in the making of this inbox.</footer>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>

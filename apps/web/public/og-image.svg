<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Nullbox — Support, but make it void.">
  <title>Nullbox — Support Ticket Portal</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15131f" />
      <stop offset="100%" stop-color="#2c2550" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect x="80" y="80" width="1040" height="470" rx="32" fill="#1f1c2c" stroke="#39334f" stroke-width="4" />
  <rect x="140" y="160" width="120" height="120" rx="28" fill="#6d4aff" />
  <circle cx="200" cy="220" r="32" fill="none" stroke="#ffffff" stroke-width="10" />
  <path d="M174 248 226 192" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
  <text x="300" y="218" fill="#ece9f7" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800">Nullbox</text>
  <text x="300" y="274" fill="#a49fbd" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="500">Support, but make it void.</text>
  <text x="140" y="380" fill="#ece9f7" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="600">Privacy-first customer support &amp; issue tracking.</text>
  <text x="140" y="440" fill="#a49fbd" font-family="system-ui, -apple-system, sans-serif" font-size="28">Report a problem without an account and track replies via secret link.</text>
</svg>
